services:
  duty-calculator:
    build: .
    container_name: duty-calculator
    ports:
      - "${PORT:-8000}:8000"
    environment:
      VDC_ADMIN_USER: "${VDC_ADMIN_USER:-admin}"
      VDC_ADMIN_PASSWORD: "${VDC_ADMIN_PASSWORD:-admin123}"
      VDC_SECRET: "${VDC_SECRET:-please-change-this-secret}"
      VDC_ADMIN_PATH: "${VDC_ADMIN_PATH:-admin}"
    volumes:
      - duty-data:/app/data
    restart: unless-stopped

volumes:
  duty-data:
