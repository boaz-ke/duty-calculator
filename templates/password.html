{% extends "base.html" %}
{% block title %}Change admin password — Vehicle Duty Calculator{% endblock %}
{% block content %}
<section class="card narrow-card">
    <h1>Change admin password</h1>
    <p class="muted">Signed in as <strong>{{ username }}</strong>. Use at least 8 characters.</p>
    <form method="post">
        <div class="field">
            <label class="field-label" for="current_password">Current password</label>
            <input id="current_password" name="current_password" type="password"
                   autocomplete="current-password" required>
        </div>
        <div class="field">
            <label class="field-label" for="new_password">New password</label>
            <input id="new_password" name="new_password" type="password"
                   autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
            <label class="field-label" for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password"
                   autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="primary-button">Update password</button>
        <a class="button secondary-margin" href="{{ url_for('admin.admin') }}">Cancel</a>
    </form>
</section>
{% endblock %}
